    <script>
        const quizData = [
            {"q": "1. ESG中的E是希望公司能做到以下何者？", "a": ["(A)排放溫室氣體", "(B)水汙染防治系統", "(C)破壞生物多樣性", "(D)增加能源開採"], "c": 1},
            {"q": "2. 我國推動綠色金融行動方案 3.0，針對資金面向之具體措施內容，下列何者為非？", "a": ["(A)協助金融機構取得綠色相關產業融資", "(B)研議氣候風險之監控機制", "(C)辦理永續領域投融資", "(D)發行與投資綠色債券"], "c": 1},
            {"q": "3. 《氣候變遷綱要公約》(UNFCCC)附件一締約國應制定下列哪一項政策？", "a": ["(A)應承擔為開發中國家提供資金與技術援助等責任", "(B)制定全球暖化政策", "(C)承諾國家自主貢獻(NDCs)", "(D)應制定國家政策和採取相應的措施來減緩氣候變化"], "c": 3},
            {"q": "4. 2023 年聯合國氣候變化大會(COP28)，於2023年11月30日至12月12日在哪一國舉行？", "a": ["(A)法國", "(B)杜拜", "(C)日本", "(D)西班牙"], "c": 1},
            {"q": "5. 我國推動綠色金融行動方案3.0，三大核心策略包含下列哪一項？", "a": ["(A)協力合作深化永續發展及達成淨零目標", "(B)整合資料及數據以強化氣候韌性與因應風險之能力", "(C)揭露碳排資訊，從投融資推動整體產業減碳", "(D)以上皆是"], "c": 3},
            {"q": "6. 上市上櫃公司永續發展實務守則的主要目的是什麼？", "a": ["(A)強制公司實施環保措施", "(B)凸顯我國企業重視永續發展並戮力實踐", "(C)減少公司的社會責任", "(D)鼓勵公司追求最大化短期獲利"], "c": 1},
            {"q": "7. 藉由跨國減量之京都機制，締約國得以自其他國家執行的減量活動中，獲得較多的氣體減量配額，以達到自身承諾的減量承諾目標，稱為下列何者？", "a": ["(A)國家自主貢獻(NDCs)", "(B)先行作為(lead action)氣候變遷行動", "(C)承諾碳中和(Carbon neutrality)目標", "(D)碳排放交易機制(Emission Trade, ET)"], "c": 3},
            {"q": "8. 我國氣候變遷因應法中，穩健實施碳定價的用意是？", "a": ["(A)提高能源價格以減少能源消費", "(B)增加企業的成本負擔", "(C)有效降低溫室氣體排放之政策工具", "(D)限制經濟發展和產業成長"], "c": 2},
            {"q": "9. 利害關係人理論強調企業應該追求以下哪種類型的價值創造？", "a": ["(A)僅追求員工和管理層的利益", "(B)長期價值的創造，綜合考慮所有利害關係人的需求", "(C)短期利益的最大化", "(D)追求股東的經濟利益"], "c": 1},
            {"q": "10. 我國推動上市櫃公司永續發展路徑圖，主要是訂定上市櫃公司什麼時程，以達永續發展？", "a": ["(A)企業社會責任報告編製時程", "(B)溫室氣體盤查資訊揭露時程", "(C)財務數據揭露時程", "(D)聯合國永續發展目標執行時程"], "c": 1},
            {"q": "11. 臺灣2050淨零排放路徑以四大轉型為策略，請問下列哪一個項目不在其中？", "a": ["(A)科技轉型", "(B)能源轉型", "(C)產業轉型", "(D)生活轉型"], "c": 0},
            {"q": "12. 《氣候變遷綱要公約》(UNFCCC) 是於哪一個會議中所提出？", "a": ["(A)人類環境會議(Conference on the Human Environment)", "(B)地球高峰會(Earth Summit)", "(C)日內瓦會議(Geneva Conference)", "(D)聯合國環境與發展會議(UNCED)"], "c": 1},
            {"q": "13. 聯合國政府間氣候變遷專門委員會(IPCC)於2018年強調將升溫控制在1.5°C以內；五年後，IPCC報告指出由於溫室氣體排放量持續增加，2011至2020年的全球地表溫度，相較於工業化前的水準，已升溫近多少度，並預估暖化高峰可能來到1.4°C至1.6°C？", "a": ["(A)0.9°C", "(B)1.0°C", "(C)1.1°C", "(D)1.2°C"], "c": 2},
            {"q": "14. 永續金融包含下列哪一項內容？", "a": ["(A)低碳金融", "(B)氣候金融", "(C)綠色金融", "(D)以上皆是"], "c": 3},
            {"q": "15. 以下是金融市場參與者與諮詢機構對具有ESG屬性的金融產品之揭露說明何者錯誤？", "a": ["(A)需強制規範每天進行揭露", "(B)負有協定前揭露(pre-contractual disclosures)", "(C)階段報告揭露(periodic reporting disclosures)", "(D)永續投資決策中的重大不利影響(PAIs)揭露等義務"], "c": 0},
            {"q": "16. 在《京都議定書》中，唯因各締約國之歷史發展與現實情況的不同，故依以下哪一個原則，要求已開發國家採取先行作為(lead action)進行氣候變遷行動？", "a": ["(A)完全一致性", "(B)共同但有差異", "(C)鑑別性", "(D)完全差異化"], "c": 1},
            {"q": "17. 我國推動綠色金融行動方案 3.0 之中五大推動面向，下列何者為非？", "a": ["(A)佈局", "(B)生態系", "(C)轉型", "(D)資金"], "c": 2},
            {"q": "18. 聯合國政府間氣候變遷專門委員會(IPCC)之第6次總結報告(AR6 Synthesis Report)主要強調的內容為何？", "a": ["(A)對減緩氣候變化的進展和承諾進行最新的全球評估", "(B)氣候變遷對世界的影響與人類的因應能力分析", "(C)強調氣候變遷、人類社會、生態系統之間的互動", "(D)探討全球暖化的原因"], "c": 0},
            {"q": "19. 有關碳邊境調整機制(CBAM)，原先歐盟執行委員會提議的高碳排產業為以下哪五大產業？", "a": ["(A)鋼鐵、水泥、氫氣、鋁、電力", "(B)鋼鐵、水泥、化肥、食品、電力", "(C)鋼鐵、塑膠、化肥、鋁、電力", "(D)鋼鐵、水泥、化肥、鋁、電力"], "c": 3},
            {"q": "20. 綠天鵝事件(Green Swan event)是由國際清算銀行(BIS)於 2020 年提出，強調什麼重要性？", "a": ["(A)氣候變化和環境風險對金融體系的重要性", "(B)強調歷史數據和模型的重要性", "(C)受保護的綠色鳥類物種發生重大變化的重要性", "(D)氣候變化引起的社會不穩定"], "c": 0},
            {"q": "21. 歐盟提及各經濟活動必須滿足三項條件，才能算是永續發展活動；以下有關三項條件之敘述，何者錯誤？", "a": ["(A)對六大環境目標中至少一項有重大貢獻", "(B)水及海洋資源保護為六大環境目標之一", "(C)可對其他目標造成重大損害", "(D)遵守最低限度的社會安全保障"], "c": 2},
            {"q": "22. 現階段造成氣候變遷問題，主因是下列何者？", "a": ["(A)過度捕撈海洋生物", "(B)地球自然的氣候循環", "(C)人類為了發展經濟過度排碳所累積造成", "(D)以上皆非"], "c": 2},
            {"q": "23. 上市上櫃公司永續發展實務守則中，關於發展永續環境，對針對水資源與溫室氣體之具體作法，不包含下列何者？", "a": ["(A)制定節能減碳管理之政策", "(B)將碳權取得納入企業減碳策略規劃、具體落實", "(C)將現有車輛全數以氫能車取代", "(D)用水量及廢棄物總重量管理之政策"], "c": 2},
            {"q": "24. 有關《氣候變遷綱要公約》(UNFCCC)的敘述，下列何者正確？", "a": ["(A)該公約對個別締約國規定具體需承擔的義務", "(B)該公約具有法律上的約束力", "(C)該公約並未規定可在後續從屬的議定書中設定強制碳排放限制", "(D)各國與會代表會在各年度的會議中，達成相關的決議內容，成為研究國際氣候變遷治理機制之重要依據"], "c": 3},
            {"q": "25. 氣候相關財務揭露工作小組(TCFD)的四項核心要素，下列何者錯誤？", "a": ["(A)治理：該組織針對氣候相關風險與機會的治理", "(B)策略：氣候相關風險與機會對於組織的業務、策略和財務規劃的實際和潛在衝擊", "(C)風險管理：組織鑑別、評估和管理氣候相關風險的流程", "(D)指標和目標：用以評估和管理企業內部短中長期的業績成長"], "c": 3},
            {"q": "26. 根據「證券投資信託事業證券投資顧問事業環境、社會及治理(ESG)投資與風險管理作業流程暨ESG資訊揭露實務指引」，公司至少多久要於永續報告書或網站發布公司ESG定期評估報告(包含ESG投資與風險管理之治理機制運作、監控ESG相關風險之作業程序及管理措施、盡職治理執行情形等)？", "a": ["(A)每月", "(B)每季", "(C)每半年", "(D)每年"], "c": 3},
            {"q": "27. 確信準則3000號中所指之Assurance Engagement 係為：", "a": ["(A)認證案件", "(B)確信案件", "(C)直接案件", "(D)適當方"], "c": 1},
            {"q": "28. 請問以下哪一個產業是現行規範揭露產業別永續揭露指標的14個產業之一？", "a": ["(A)生技醫療業", "(B)資訊服務業", "(C)貿易百貨業", "(D)電子通路業"], "c": 2},
            {"q": "29. 有關組織依循GRI準則決定重大主題的流程，下列敘述何者正確？", "a": ["(A)每個步驟的方法將根據組織的特定情況而有所不同", "(B)同一國家中所有組織的每個步驟的方法都相同", "(C)同樣行業別中所有組織的每個步驟的方法都相同", "(D)所有組織的每個步驟的方法都相同"], "c": 0},
            {"q": "30. 有關GRI準則中對於決定重大主題時，組織鑑別衝擊的相關敘述，下列何者正確？", "a": ["(A)可以使用第三方評估所得的資訊", "(B)不可以使用第三方評估所得的資訊", "(C)不可以使用自己評估所得的資訊", "(D)只可以使用自己評估所得的資訊"], "c": 0},
            {"q": "31. 上市上櫃公司子公司之綜合證券商應於哪個年度完成溫室氣體盤查？", "a": ["(A)112 年", "(B)113 年", "(C)114 年", "(D)與上市上櫃母公司之時程一致"], "c": 3},
            {"q": "32. SASB 準則五大面向當中的領導與治理(Leadership and Governance)，下列何者是其包含的ESG議題？", "a": ["(A)生態衝擊(Ecological Impacts)", "(B)法規和監管環境的管理(Management of the Legal & Regulatory Environment)", "(C)勞工關係(Labor Practices)", "(D)資訊安全(Data Security)"], "c": 1},
            {"q": "33. 2021 年 11 月3日 COP26 會議上，國際財務報導準則基金會(IFRS Foundation)進一步正式宣布成立國際永續準則委員會(ISSB)，並宣布將價值報告基金會(VRF)併入IFRS Foundation。說明此一系列的整合行動，是為了回應何種的需求？", "a": ["(A)利於全球企業供應鏈管理", "(B)全球投資機構對高品質永續相關資訊揭露的需求", "(C)幫助各地政府掌握永續資訊", "(D)協助企業進行內部碳定價"], "c": 1},
            {"q": "34. 有關組織依循GRI準則決定重大主題的流程，下列敘述何者錯誤？", "a": ["(A)在每個報導期間，組織宜重新檢視其上一個報導期間的重大主題，以解釋衝擊的變化", "(B)衝擊的變化可能源於組織活動的變化", "(C)衝擊的變化不可能源於組織商業關係的變化", "(D)重新檢視有助於確保重大主題能代表組織在每個新的報導期間內最顯著的衝擊"], "c": 2},
            {"q": "35. 投信投顧事業設置之投資研究部門應進行永續投資研究及盡職治理調查，下列哪項不是「證券投資信託事業證券投資顧問事業環境、社會及治理(ESG)投資與風險管理作業流程暨 ESG 資訊揭露實務指引」強調需瞭解被投資公司是否善盡之面向？", "a": ["(A)環境保護", "(B)財務績效", "(C)公司治理", "(D)社會責任"], "c": 1},
            {"q": "36. 根據「保險業氣候相關風險財務揭露指引」，針對保險業風險管理及監控之敘述，下列何者正確？ 甲、訂定評估方法，以辨認具氣候相關風險之部門、交易對手及客戶包括現有及潛在之交易對手及客戶並評估其影響；乙、訂定氣候相關風險曝險之管理及持續監控機制；丙、針對公司鑑別之氣候風險依「保險業內部控制三道防線實務守則」進行風險管理", "a": ["(A)僅甲、乙", "(B)僅甲、丙", "(C)僅乙、丙", "(D)甲、乙、丙皆是"], "c": 3},
            {"q": "37. SASB 準則五大面向當中的人力資本(Human Capital)，針對其中一項ESG議題：勞工關係(Labor Practices)，下列描述何者正確？", "a": ["(A)包括最低工資政策和福利規定，這可能會影響勞動力的吸引、保留和激勵方式", "(B)此議題涉及公司在工作場所維護普遍接受的勞工標準的能力，但不包括遵守勞動法和國際公認的規範和標準", "(C)不包括童工保護議題", "(D)此議題無法進一步解決公司與勞工組織和結社自由的關係"], "c": 0},
            {"q": "38. GRI 準則2021之系統架構於三個系列準則，分別為下列何者？", "a": ["(A)GRI 環境準則、GRI社會準則、GRI治理準則", "(B)GRI 環境準則、GRI社會準則、GRI經濟準則", "(C)GRI 通用準則、GRI進階準則、GRI特殊準則", "(D)GRI 通用準則、GRI行業準則、GRI主題準則"], "c": 3},

const STORAGE_KEY = "esg_quiz_progress";
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { saved = null; }

const userAnswers = (saved && Array.isArray(saved.answers))
    ? saved.answers
    : new Array(quizData.length).fill(null);

let currentIdx = (saved && Number.isInteger(saved.currentIdx))
    ? saved.currentIdx
    : 0;

if (currentIdx < 0 || currentIdx >= quizData.length) currentIdx = 0;

function persist() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers: userAnswers, currentIdx }));
    } catch (e) {}
}

function render() {
            const data = quizData[currentIdx];
            const hasAns = userAnswers[currentIdx] !== null;
            document.getElementById('progress-text').innerText = (currentIdx + 1) + ' / ' + quizData.length;
            
            let html = '<div><div class="mb-4"><span class="px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded">第 ' + (currentIdx+1) + ' 題</span></div>';
            html += '<h2 class="text-xl font-bold mb-6 text-slate-800">' + data.q + '</h2><div class="space-y-3">';

            data.a.forEach((opt, i) => {
                let state = "border-slate-200 hover:bg-slate-50";
                if (hasAns) {
                    if (i === data.c) state = "correct-active border-emerald-500 font-bold";
                    else if (i === userAnswers[currentIdx]) state = "wrong-active border-red-500 font-bold";
                    else state = "opacity-40";
                }
                html += '<button onclick="handleSelect(' + i + ')" ' + (hasAns ? 'disabled' : '') + ' class="w-full text-left p-4 rounded-xl border-2 transition-all flex items-start gap-3 ' + state + '">';
                html += '<span class="bg-slate-100 px-2 rounded font-bold">' + String.fromCharCode(65+i) + '</span>';
                html += '<span>' + opt + '</span></button>';
            });
            html += '</div></div>';
            document.getElementById('quiz-container').innerHTML = html;
            document.getElementById('next-btn').innerText = currentIdx === quizData.length - 1 ? "查看結果" : "下一題";
        }

        window.handleSelect = (i) => {
            if (userAnswers[currentIdx] !== null) return;
            userAnswers[currentIdx] = i;
            persist();
            render();
        };

        document.getElementById('prev-btn').onclick = () => { if (currentIdx > 0) { currentIdx--; persist(); render(); } };
        document.getElementById('next-btn').onclick = () => {
            if (currentIdx < quizData.length - 1) { currentIdx++; persist(); render(); }
            else { showResult(); }
        };

        function showResult() {
            try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
            let correct = 0;
            userAnswers.forEach((a, idx) => { if (a === quizData[idx].c) correct++; });
            document.getElementById('quiz-container').innerHTML = '<div class="text-center py-10"><h2 class="text-3xl font-bold mb-4">測驗完成</h2><p class="text-xl mb-4">得分：' + Math.round(correct/80*100) + '</p><p>答對題數：' + correct + ' / 80</p><button onclick="location.reload()" class="mt-8 px-6 py-2 bg-slate-900 text-white rounded-lg">重新開始</button></div>';
            document.querySelector('footer').style.display = 'none';
        }
// （選用）盡量保持螢幕常亮（Safari/加入主畫面支援度依版本而定）
let wakeLock = null;

async function keepScreenAwake() {
    try {
        if ("wakeLock" in navigator && navigator.wakeLock) {
            wakeLock = await navigator.wakeLock.request("screen");
        }
    } catch (e) {}
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        keepScreenAwake();
    }
});

render();
keepScreenAwake();

    </script>
