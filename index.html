<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG 永續發展測驗</title>

<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC";background:#0b1220;color:#e5e7eb}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:#121a2a;border-radius:16px;padding:16px;margin-bottom:16px}
.muted{color:#94a3b8}
.barwrap{height:10px;background:#1e293b;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0%;background:#14b8a6}
.opt{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #334155;background:#020617;color:#e5e7eb;text-align:left;cursor:pointer}
.opt.selected{outline:2px solid #14b8a6}
.btn{padding:10px 14px;border-radius:12px;border:1px solid #334155;background:#020617;color:#e5e7eb;cursor:pointer}
.btn:disabled{opacity:.4}
.scoreCard{border:2px solid #14b8a6;border-radius:12px;padding:16px;margin-top:12px}
.fail{border-color:#ef4444}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h2>ESG 永續發展測驗</h2>
<div class="muted" id="status">初始化中…</div>
</div>

<div class="card">
<div class="barwrap"><div class="bar" id="bar"></div></div>
<div class="muted" id="progress"></div>
</div>

<div class="card" id="questionArea">載入題庫中…</div>

<div class="card">
<button class="btn" id="prev">上一題</button>
<button class="btn" id="next">下一題</button>
<button class="btn" id="submit">交卷</button>
<button class="btn" id="reset">重來</button>
</div>

</div>

<script>
(() => {
const URL="./questions_all.json";
const PICK=80,POINT=1.25,PASS=70;
const LS="esg_exam_v1";

const elStatus=status;
const elQ=questionArea;
const elP=progress;
const elBar=bar;

let bank=[],exam=[],idx=0,ans={},done=false;

function save(){localStorage.setItem(LS,JSON.stringify({exam,idx,ans,done}))}
function load(){try{Object.assign({},{},JSON.parse(localStorage.getItem(LS)||"{}"),{exam,idx,ans,done})}catch{}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function cur(){return exam[idx]}

function render(){
const q=cur();
elP.textContent=`第 ${idx+1} / ${exam.length} 題（題庫ID：${q.id}，題庫共 ${bank.length} 題）`;
elBar.style.width=`${((idx+1)/exam.length)*100}%`;
elQ.innerHTML=`<h3>${q.q}</h3>`+
q.a.map((t,i)=>`<button class="opt ${ans[q.id]===i?"selected":""}" data-i="${i}">${t}</button>`).join("");

elQ.querySelectorAll(".opt").forEach(b=>{
b.onclick=()=>{if(done)return;ans[q.id]=+b.dataset.i;save();render();}
});
prev.disabled=idx===0;
next.disabled=idx===exam.length-1;
}

function submit(){
let correct=0;
exam.forEach(q=>{if(ans[q.id]===q.c)correct++});
const score=(correct*POINT).toFixed(2);
done=true;save();
elQ.innerHTML+=`<div class="scoreCard ${score<PASS?"fail":""}">
<h3>成績：${score} 分</h3>
<div>${score>=PASS?"✅ 及格":"❌ 未及格"}</div>
<div>正確 ${correct} / ${exam.length}</div>
</div>`;
}

async function init(){
elStatus.textContent="載入題庫…";
const r=await fetch(URL,{cache:"no-store"});
bank=await r.json();

load();
if(!exam.length){
exam=shuffle([...bank]).slice(0,PICK);
idx=0;ans={};done=false;save();
}
elStatus.textContent="題庫就緒";
render();
}

prev.onclick=()=>{idx--;save();render()};
next.onclick=()=>{idx++;save();render()};
submit.onclick=submit;
reset.onclick=()=>{localStorage.removeItem(LS);location.reload()};

init();
})();
</script>
</body>
</html>
